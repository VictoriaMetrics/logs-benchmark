# Elasticsearch via the ECK operator (the classic elasticsearch Helm chart is
# deprecated), installed as one Elasticsearch CR from deploy/charts/elasticsearch.
# Only what the benchmark methodology requires is overridden: TLS off, the
# anonymous superuser below, and the mmap sysctl, which the chart fixes because
# they are the same for every instance.
# Engine config for every instance, hardware-agnostic; per-instance identity:
# pin/elasticsearch.yaml; sizing (PVC size and storage class): the benchmark's
# systems/elasticsearch.yaml.
version: 9.5.5 # pinned so the measured version never floats

# Bench clients connect without credentials; ECK has no switch for turning
# security off outright.
config:
  xpack.security.authc.anonymous.username: bench
  xpack.security.authc.anonymous.roles: superuser

# No limits, so Elasticsearch gets its whole node. ECK adds a 2Gi request and
# limit when both are missing, so the requests below keep the pod unlimited.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
