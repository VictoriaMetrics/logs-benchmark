# Grafana Loki via the grafana-community/loki chart, single-binary mode with
# filesystem storage (one pod, like every other system under test).
# Engine config for every instance, hardware-agnostic; per-instance identity:
# pin/loki.yaml; sizing (PVC size and storage class): the benchmark's
# systems/loki.yaml.
#
# The client Service takes the release name only when that name contains "loki"
# (helm fullname rule), so keep "loki" in the instance name.
deploymentMode: Monolithic

loki:
  # pinned so the measured version never floats with chart updates
  image:
    tag: "3.7.8"
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    # By default, Loki rejects logs above 4 MB/s and above 5000 streams per
    # tenant. A run sends more than that (it has hosts x apps streams), so the
    # rate limits are set far above any run, and both stream limits are off.
    # Both must be off, because Loki uses the lower of the two.
    max_streams_per_user: 0
    max_global_streams_per_user: 0
    ingestion_rate_mb: 1024
    ingestion_burst_size_mb: 2048

singleBinary:
  replicas: 1
  # No limits, so Loki gets its whole node.
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
  persistence:
    enabled: true
    # Delete the PVC on uninstall, so a reinstall starts from an empty disk.
    enableStatefulSetAutoDeletePVC: true

# Single-node: keep only the single-binary pod, drop every extra component so
# nothing else needs a node or a toleration.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
# The rules sidecar watches ConfigMaps for alerting rules; no rules here, and
# its CPU and memory would count as Loki's.
sidecar:
  rules:
    enabled: false
test:
  enabled: false
minio:
  enabled: false
